name: Deploy The Money Journey to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Build self-contained arcade games
        run: python3 sources/arcade/build.py && python3 sources/fishing/build.py && python3 sources/fleet/build.py
      - name: Check syntax, authentication and game rules
        run: npm run check && npm test
      - name: Bundle the current source
        run: npm run bundle
      - name: Refresh cached stylesheets for this upload
        run: |
          sha="${GITHUB_SHA::7}"
          find site -name '*.html' -print0 | xargs -0 sed -i -E \
            -e "s/\\?v=auto/?v=${sha}/g" \
            -e "s/\\?v=20[0-9]{6}-[A-Za-z0-9._-]+/?v=${sha}/g"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
