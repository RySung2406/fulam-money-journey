  radial-gradient(2px 2px at 46% 22%,#fff7,#0000),
  radial-gradient(1.5px 1.5px at 63% 58%,#fff5,#0000),
  radial-gradient(2px 2px at 78% 34%,#fff8,#0000),
  radial-gradient(1.5px 1.5px at 88% 72%,#fff6,#0000),
  radial-gradient(2px 2px at 34% 78%,#fff7,#0000);
 animation:journey-snow 18s linear infinite;
}
.journey-card{
 position:relative;z-index:1;isolation:isolate;
 background:
  linear-gradient(#c23b3b 0 4px,#2f8f63 4px 7px,#0000 7px),
  linear-gradient(165deg,#163a32f7,#0f2a28f5 55%,#142433f2);
 border:1px solid #f0d87866;
 box-shadow:0 24px 70px #020a1488,inset 0 1px #fff4cb22;
 overflow:hidden;
}
.journey-card:before,.journey-card:after{
 content:"";position:absolute;width:14px;height:14px;border-radius:50%;
 background:radial-gradient(circle at 35% 35%,#fff4cb,#c23b3b 58%,#8e2428);
 box-shadow:16px 0 0 -3px #2f8f63,24px 4px 0 -4px #c23b3b,8px 12px 0 -4px #2f8f63;
 pointer-events:none;z-index:2;opacity:.9;
}
.journey-card:before{top:14px;left:14px}
.journey-card:after{top:14px;right:14px;transform:scaleX(-1)}
.journey-kicker{
 display:inline-block;color:#f0d878;letter-spacing:.14em;text-transform:uppercase;
 padding:4px 0 2px;border-bottom:1px solid #f0d87844;
}
.journey-card h2{color:#fff6d8;text-shadow:0 1px 0 #0a1f1c}
.journey-guide-rule{color:#f0d878!important}
.journey-guide-grid>div{
 background:linear-gradient(180deg,#f7f1df,#e8efd8);
 border:1px solid #c9b67a88;color:#173d35;
}
.journey-guide-grid kbd{
 background:#fff4cb;border-color:#c23b3b88;color:#8e2428;
 box-shadow:inset 0 -2px #c23b3b33;
}
.journey-guide-question,.journey-granted{
 background:linear-gradient(120deg,#fff1cd,#ffe7a8);
 border-left-color:#c23b3b;color:#173d35;
}
.journey-scene-note{
 background:linear-gradient(120deg,#dce8dc,#cfe6d4);
 border:1px solid #2f8f6344;
}
.journey-begin{
 background:linear-gradient(120deg,#fff4cb,#f0d878);
 border-color:#fff1be;color:#163b34;
 box-shadow:0 3px 0 #b48a2f88;
}
.journey-begin:hover{filter:brightness(1.06)}
.journey-booth{
 border-color:#f0d878;background:linear-gradient(120deg,#214b3b,#2f8f63);color:#fff6d8;
}
.journey-booth[aria-pressed=true]{
 background:linear-gradient(120deg,#8e2428,#c23b3b);border-color:#fff4cb;color:#fff6d8;
 box-shadow:inset 0 0 0 1px #fff4cb88;
}
.journey-status{
 background:linear-gradient(90deg,#143b32,#1a4a3c 40%,#3a1a1e);
 color:#fff4cb;border-bottom:1px solid #f0d87844;
}
.journey-quiz-card .journey-quiz-q{
 padding:10px 12px;border-radius:10px;
 background:#0f2824;border:1px solid #f0d87844;color:#fff6d8;
}
.journey-quiz-card .journey-quiz-choices button{
 background:linear-gradient(180deg,#f7f1df,#e9eedc);border-color:#b9a56a;
}
.journey-quiz-card .journey-quiz-choices button:hover{border-color:#c23b3b;filter:brightness(1.03)}
.journey-quiz-card .journey-quiz-choices button.is-wrong{
 background:#f3dede;border-color:#c07070;opacity:.7;
}
.journey-quiz-tip{
 background:linear-gradient(120deg,#fff6e8,#ffe8c0);
 border-color:#c23b3b66;color:#4a3420;
 animation:journey-garland 2.4s ease-in-out infinite;
}
.journey-next{
 border-left:3px solid #c23b3b;
 background:linear-gradient(90deg,#ffffff12,#ffffff05);
}
.showing-result>.overlay{
 background:
  radial-gradient(ellipse at 20% 0%,#2f6a4e44,transparent 45%),
  radial-gradient(ellipse at 80% 100%,#8e242844,transparent 40%),
  #061812eb;
}
.showing-result .card,.showing-result #end-menu{
 border:1px solid #f0d87866;
 background:
  linear-gradient(#c23b3b 0 4px,#2f8f63 4px 7px,#0000 7px),
  linear-gradient(165deg,#163a32,#102a2c 60%,#142433);
 box-shadow:0 24px 70px #020a1488;
}
.showing-result .result-heading h2,.showing-result .result-score,.showing-result .end-score strong{color:#fff4cb}
.journey-scoreboard .score-list li.this-run{background:#c23b3b22;box-shadow:inset 2px 0 #f0d878}
.journey-scoreboard .result-lesson{
 background:#ffffff0c;border-left:2px solid #c23b3b;
}
.journey-result{
 border-color:#f0d87866;
 background:linear-gradient(160deg,#163a3288,#0f282488);
}
@media(prefers-reduced-motion:reduce){
 .journey-overlay:before,.journey-quiz-tip{animation:none!important}
}

/* Quiet Noel — in-play HUD only: thin ornaments, never over the canvas action. */
.journey-live>.journey-status{
 background:
  linear-gradient(#c23b3b 0 2px,#2f8f63 2px 4px,#0000 4px),
  linear-gradient(90deg,#143b32,#1a4a3c 42%,#3a1a1e);
 color:#fff4cb;border-bottom:1px solid #f0d87855;
 letter-spacing:.01em;box-shadow:0 6px 18px #020a1433;
}
.scene.journey-live .timer{
 background:linear-gradient(160deg,#163a32ee,#0f2824ee)!important;
 border:1px solid #f0d87855!important;color:#fff4cb;
 box-shadow:inset 0 1px #fff4cb22;
}
.scene.journey-live .timer.urgent{
 border-color:#c23b3b88!important;color:#ffc4b0!important;
 background:linear-gradient(160deg,#3a1a1eee,#2a1216ee)!important;
}
.scene.journey-live .score-value,.sea.journey-live #score{color:#fff4cb!important;text-shadow:0 1px 8px #020a1466}
.scene.journey-live .combo b{color:#fff4cb!important}
.scene.journey-live .event,.sea.journey-live .event-banner{
 border-color:#f0d87855!important;background:#163a32ee!important;color:#fff4cb!important;
}
.scene.journey-live .control-panel,.combat-score-mode .control-panel{
 border-color:#f0d87833!important;
 background:linear-gradient(135deg,#163a32,#0f2824 55%,#142433)!important;
}
.scene.journey-live .ability{
 border-color:#2f8f6355!important;
 background:linear-gradient(160deg,#123d3a,#0a2428)!important;
}
.scene.journey-live .ability:not(:disabled){border-color:#f0d87844!important}
.scene.journey-live .upgrade:not(:disabled){
 background:linear-gradient(145deg,#fff4cb,#f0d878)!important;color:#17392b!important;
 border-color:#b48a2f!important;
}
.sea.journey-live .hud{
 background:linear-gradient(110deg,#163a32,#102a28 50%,#2a1a1e)!important;
 border-bottom:1px solid #f0d87833;
}
.sea.journey-live>.sector{
 color:#fff4cb;text-shadow:0 1px 6px #020a1466;
}
.sea.journey-live .boss-bar{
 border-color:#c23b3b66;background:#163a32cc;
}
.fleet-playing .battle-footer,.fleet-playing .combat-actions{
 background:linear-gradient(0deg,#0f2824f0,#0f282488);
 border-top:1px solid #f0d87822;
}
.fleet-playing .shield-btn{
 border-color:#f0d87844!important;
 background:linear-gradient(145deg,#214b3b,#163a32)!important;color:#fff4cb!important;
}
.game-wrap.journey-live .question-bar{
 border-color:#f0d87844!important;
 background:
  linear-gradient(#c23b3b 0 2px,#2f8f63 2px 4px,#0000 4px),
  linear-gradient(135deg,#163a32f0,#0f2824ee)!important;
 box-shadow:0 12px 36px #020a1444,inset 0 1px #fff4cb18!important;
}
.game-wrap.journey-live .question-bar .eyebrow{color:#f0d878!important}
.game-wrap.journey-live .question-bar h1{color:#fff6d8}
.game-wrap.journey-live .game-hud{
 border-color:#f0d87833!important;
 background:linear-gradient(160deg,#163a32e8,#0f2824e0)!important;
}
.game-wrap.journey-live .score-value,.game-wrap.journey-live .combo-block{color:#fff4cb}
.game-wrap.journey-live .arena-footer{
 background:linear-gradient(0deg,#0f2824f2,#0f282466)!important;
 border-top:1px solid #f0d87822;
 color:#e8f0df;
}
.game-wrap.journey-live .step-dot.current{
 background:#f0d878;box-shadow:0 0 10px #f0d87833;
}
.game-wrap.journey-live .step-dot.done{background:#2f8f63}
.scene.journey-live,.sea.journey-live{
 box-shadow:inset 0 0 0 1px #f0d87822,0 18px 48px #020a1444;
}

<script>

  const sprites = new Map();

  const palettes = {

    save: ['#d9ffe8', '#3db87a', '#1f5a3f', '#edb579'],
    fund: ['#ffe4ef', '#d47aa8', '#7a2d55', '#edb579'],
    stock: ['#ffe6dc', '#e85a4a', '#8b2430', '#fff2c8'],
    whale: ['#dff7ef', '#2a8f88', '#0a4a52', '#edb579'],
    shark: ['#e8f6ff', '#7ab8d9', '#2a4f6e', '#c23b3b'],
    ray: ['#e6fff4', '#4ec4a8', '#1a5d5a', '#edb579'],

  const TAU = Math.PI * 2;
  const ellipse = (c, x, y, rx, ry, fill, stroke, width = 1) => {
    c.beginPath(); c.ellipse(x, y, rx, ry, 0, 0, TAU);
    if (fill) { c.fillStyle = fill; c.fill(); }
    if (stroke) { c.strokeStyle = stroke; c.lineWidth = width; c.stroke(); }
  };
  const path = (c, d, fill, stroke, width = 1) => {
    const p = new Path2D(d);
    if (fill) { c.fillStyle = fill; c.fill(p); }
    if (stroke) { c.strokeStyle = stroke; c.lineWidth = width; c.stroke(p); }
  };
  const gradient = (c, x1, y1, x2, y2, stops) => {
    const g = c.createLinearGradient(x1, y1, x2, y2);
    stops.forEach(([s, col]) => g.addColorStop(s, col)); return g;
  };
  // Small Christmas props drawn in sprite space (origin at fish centre).
  const santaHat = (c, x, y, sc = 1) => {

  const scarf = (c, x, y, sc = 1, a = '#c23b3b', b = '#fffef9') => {
    c.save(); c.translate(x, y); c.scale(sc, sc);

  const miniTree = (c, x, y, sc = 1) => {

  function makeSprite(type, tailOnly = false) {

    if (sprites.has(key)) return sprites.get(key);

        path(c,'M -38 -2 C -52 -7 -62 -21 -83 -24 Q -78 -3 -60 1 Q -77 7 -83 25 C -61 23 -50 9 -38 7 Z',fin,p[2],1.5);

        path(c,'M -23 0 Q -48 -8 -64 5 T -88 1',null,p[2],4);
        path(c,'M -23 0 Q -48 -8 -64 5 T -88 1',null,p[0],1.2);
      } else if (type === 'bond') {
        path(c,'M -34 -2 L -57 0 L -34 7 Z',fin,p[2],1);
      } else if (type === 'crypto' || type === 'gold') {
        // Their curled tails / tendrils are part of the body sprite.
      } else if (type === 'fund') {
        path(c,'M -35 -2 Q -60 -8 -85 -2 Q -68 1 -58 6 Q -47 7 -35 3 Z',p[2]);
        path(c,'M -42 1 Q -68 -2 -84 -2',null,p[0],1.5);
      } else {
        path(c,'M -36 -3 Q -52 -10 -75 -28 Q -82 -13 -71 0 Q -83 15 -75 29 Q -54 13 -36 5 Z',fin,p[2],1.4);
        for (let i = -2; i <= 2; i++) path(c,`M -41 1 Q -55 ${i*4} -74 ${i*10}`,null,p[0]+'88',1.1);
      }
      sprites.set(key,canvas); return canvas;
    }

    c.shadowColor='#001d31aa'; c.shadowBlur=6; c.shadowOffsetY=4;
    if (type === 'lantern') {
      path(c,'M -41 -5 Q -22 -37 16 -29 Q 47 -26 57 1 L 41 1 L 51 13 Q 25 36 -4 29 Q -29 25 -41 7 Z',body,p[2],2);
      c.shadowColor='transparent';
      path(c,'M -12 -27 Q -23 -48 -38 -39 L -33 -25 Z',fin,p[2],2);
      path(c,'M -24 9 Q -33 32 -5 23 L 5 10 Z',fin,p[2],2);
      path(c,'M 11 -26 C 17 -66 56 -65 61 -39',null,p[2],5);
      path(c,'M 11 -26 C 17 -66 56 -65 61 -39',null,p[3],2.2);
      ellipse(c,61,-36,7,9,'#caffd4','#22af97',2);
      for(let i=0;i<5;i++)ellipse(c,-25+i*10,12+Math.sin(i*.7)*4,2.6,2,p[3]);
      path(c,'M 36 4 L 39 8 L 42 4 M 42 1 L 45 5 L 48 1',null,'#e9ffdf',1.5);
    } else if (type === 'puffer') {
      for(let i=0;i<12;i++){
        const a=i*TAU/12;
        c.save();c.rotate(a);
        path(c,'M 31 -8 L 52 -3 L 33 5 Z','#d0f5ff',p[2],1.5);
        c.restore();
      }
      ellipse(c,1,0,44,38,body,p[2],2);
      c.shadowColor='transparent';
      path(c,'M -37 9 Q -9 37 37 9 Q 24 37 3 37 Q -22 37 -37 9 Z','#d9f7ff');
      path(c,'M -12 -4 Q -34 -18 -29 0 Q -22 12 -10 6 Z',fin,p[2],1.5);
      for(const [x,y] of [[-18,-15],[-7,-22],[4,-14],[14,-22],[-5,11]])ellipse(c,x,y,3,2.7,'#256381');
      path(c,'M 34 9 Q 42 13 46 6',null,p[2],2);
      santaHat(c,7,-28,.62);
    } else if (type === 'ray') {
      // Broad manta wings carry a diversified ETF basket, with a flowing whip tail.
      path(c,'M -31 0 Q -37 -17 -61 -63 Q -19 -54 7 -29 Q 26 -18 45 -14 L 59 -5 L 53 0 L 59 5 L 45 14 Q 26 18 7 29 Q -19 54 -61 63 Q -37 17 -31 0 Z',body,p[2],1.8);

      path(c,'M -46 -46 Q -7 -36 28 -10 M -46 46 Q -7 36 28 10',null,p[0]+'99',2);

        path(c,`M ${-39+i*10} -${34-i*6} Q -4 -15 17 -5 M ${-39+i*10} ${34-i*6} Q -4 15 17 5`,null,'#d9fff744',1.1);
      }
      ellipse(c,0,0,29,21,'#103b6466','#e4fff4aa',1.5);
      const chart=['#ffd77d','#a6e5ff','#ddaaff'];
      for(let i=0;i<3;i++) {
        c.fillStyle=chart[i];c.beginPath();c.roundRect(-17+i*11,-9+(i===1?3:0),8,16-(i===1?3:0),2);c.fill();

      c.font='bold 10px sans-serif';c.textAlign='center';c.fillStyle='#ecfff5';c.fillText('ETF',0,17);

      // Coupon-bond turtle: steady armour, not a risk-free guarantee.
      for(const side of [-1,1]) {
        path(c,`M -22 ${side*15} Q -48 ${side*27} -50 ${side*45} Q -27 ${side*42} -13 ${side*25} Z`,fin,p[2],1.3);

      }
      ellipse(c,47,0,22,16,fin,p[2],1.5);
      ellipse(c,-4,0,44,33,body,p[2],2);
      c.shadowColor='transparent';
      path(c,'M -31 -17 L -8 -28 L 19 -19 L 29 1 L 13 24 L -13 27 L -36 9 Z','#2d654aaa','#e7f6b3aa',1.6);
      path(c,'M -8 -28 L -7 -9 L 8 2 L 29 1 M -7 -9 L -29 -4 L -36 9 M -29 -4 L -31 -17 M 8 2 L 1 20 L 13 24 M 1 20 L -13 27',null,'#e3f5b566',1.5);

    } else if (type === 'crypto') {
      // Volatility jellyfish: translucent bell, jagged price path and trailing ribbons.
      for(let i=0;i<5;i++) {

        path(c,`M -9 ${yy} C -31 ${yy-17} -39 ${yy+21} -55 ${yy+4} S -78 ${yy+9} -85 ${yy-4}`,null,i%2?'#d6a4ef':'#a7edee',2.4-i*.2);

      path(c,'M -19 -37 Q 32 -55 60 -7 Q 65 0 60 7 Q 32 55 -19 37 Q -2 23 -17 12 Q -2 0 -17 -12 Q -2 -23 -19 -37 Z',body,p[2],1.8);
      c.shadowColor='transparent';
      path(c,'M -5 -29 Q 31 -35 48 -9 M -4 29 Q 31 35 48 9',null,'#ffe5ff99',2);

      path(c,'M 0 8 L 9 -7 L 18 9 L 27 -12 L 36 -1',null,'#fff3aa',3);
      ellipse(c,18,-30,3,3,'#b9fbff');
    } else if (type === 'gold') {
      // Bullion seahorse with a coiled tail and layered gold-bar plates.
      path(c,'M 6 -50 Q 30 -61 39 -41 L 62 -34 L 58 -22 L 36 -25 Q 26 -17 28 -3 Q 31 16 15 25 Q -2 33 -6 44 Q -12 59 -27 51 Q -39 44 -31 32 Q -24 25 -17 34 Q -12 43 -22 43',body,p[2],2);
      c.shadowColor='transparent';
      path(c,'M 7 -33 L -6 -38 L -3 -21 L -17 -22 L -11 -4 L -22 -1 L -12 13 L -21 21 L -6 28',fin,p[2],1.5);
      path(c,'M 19 -11 Q 42 1 40 16 Q 23 12 15 1 Z',fin,p[2],1);
      path(c,'M 13 -40 L 17 -48 L 24 -40 M 22 -18 Q 3 -12 5 6 Q 5 23 -6 30',null,'#fff3ad99',2.2);
      for(let i=0;i<4;i++) {
        const yy=-19+i*10;
        path(c,`M 4 ${yy} L 16 ${yy-2} L 20 ${yy+4} L 7 ${yy+6} Z`,'#ffdd77','#a26c2e',1);
      }
      c.font='bold 9px sans-serif';c.fillStyle='#8b5427';c.textAlign='center';c.fillText('Au',13,9);
    } else if (type === 'fund') {
      path(c,'M -37 0 Q -21 -15 -47 -58 Q -6 -52 16 -31 Q 33 -14 56 0 Q 28 11 12 29 Q -8 50 -47 58 Q -20 13 -37 0 Z',body,p[2],1.8);
      c.shadowColor='transparent';
      path(c,'M -32 -42 Q 4 -30 39 -3 M -32 42 Q 4 30 39 3',null,p[0]+'88',2);
      path(c,'M -20 -35 Q 2 -25 27 -6 M -20 35 Q 2 25 27 6',null,p[0]+'44',1.3);
      ellipse(c,7,0,34,23,body,p[2],1);
      // A segmented portfolio wheel makes the pooled fund recognisable.
      ellipse(c,7,0,17,17,'#f1d88e','#fff5c8',1.4);
      c.beginPath();c.moveTo(7,0);c.arc(7,0,17,-Math.PI/2,Math.PI*.16);c.closePath();c.fillStyle='#88e4d2';c.fill();
      c.beginPath();c.moveTo(7,0);c.arc(7,0,17,Math.PI*.16,Math.PI);c.closePath();c.fillStyle='#d5b1fb';c.fill();
      path(c,'M 7 -17 L 7 0 L -10 0 M 7 0 L 22 8',null,'#514378',1.4);
    } else if (type === 'whale' || type === 'midas') {
      path(c,'M -42 -9 Q -25 -27 8 -32 Q 55 -38 72 -13 Q 83 5 67 24 Q 48 42 6 34 Q -26 30 -42 9 Z',body,p[2],1.6);
      c.shadowColor='transparent';
      path(c,'M -30 17 Q 5 38 54 25 Q 71 21 75 9 Q 64 35 26 36 Q -9 35 -30 17 Z',type==='midas'?'#ffe9a899':'#c5efce99');
      path(c,'M -13 5 Q 9 17 9 47 Q -13 40 -23 17 Z',fin,p[2],1);
      path(c,'M -12 -28 L 4 -44 Q 13 -43 21 -30',p[2]);
      for (let i = 0; i < 4; i++) path(c,`M ${17+i*9} 25 Q ${20+i*8} 30 ${26+i*8} 30`,null,type==='midas'?'#c4892a90':'#256a7190',1);
      if(type==='midas'){
        santaHat(c,31,-34,.58);
        path(c,'M 52 12 Q 62 14 72 5',null,'#99642d',2);
        path(c,'M -30 -9 Q -15 -27 9 -28',null,'#fff2ad',2.1);
      }else santaHat(c,42,-36,1.45);
      ellipse(c,8,-1,20,21,type==='midas'?'#7a4a1866':'#103f5366','#e5bf70',2.2);
      ellipse(c,8,-1,13,14,null,'#ffe69a',1.2);
      ellipse(c,8,-1,4,4,'#ffe69a');
      for(let i=0;i<4;i++){const a=i*TAU/4;path(c,`M ${8+Math.cos(a)*4} ${-1+Math.sin(a)*4} L ${8+Math.cos(a)*12} ${-1+Math.sin(a)*12}`,null,'#ffe69a',2);}
    } else if (type === 'shark') {
      path(c,'M -47 -7 Q -16 -22 23 -19 L 74 -3 Q 52 22 13 22 Q -24 19 -47 7 Z',body,p[2],1.8);
      c.shadowColor='transparent';
      path(c,'M -8 -19 Q 3 -45 17 -48 L 23 -18 Z',fin,p[2],1.4);
      path(c,'M -6 12 Q 7 36 26 42 L 20 17 Z',fin,p[2],1.2);
      path(c,'M -30 9 Q 21 27 66 3 Q 49 23 9 22 Z','#f6c9df99');
      for(let i=0;i<3;i++) path(c,`M ${15-i*6} -4 Q ${11-i*6} 4 ${15-i*6} 10`,null,'#6b3b79',1.5);
      path(c,'M 46 8 Q 55 12 65 2',null,'#532847',2);
      path(c,'M 49 9 L 51 13 L 54 10 L 57 11 L 60 7','#fff0da');
      // Fast market shark: forward chevrons and a deliberately jagged price stripe.
      path(c,'M -33 -6 L -23 0 L -33 6 M -20 -7 L -10 0 L -20 7',null,'#d3f6ff99',2);
      path(c,'M -9 6 L -2 -4 L 5 4 L 12 -8 L 19 -2',null,'#ffd58d',2.3);
    } else {
      path(c,'M -24 -22 Q -21 -45 6 -41 Q 19 -34 24 -24 Z',fin,p[2],1.2);
      path(c,'M -24 22 Q -14 41 8 38 L 20 23 Z',fin,p[2],1.2);
      path(c,'M -42 -5 Q -17 -39 17 -30 Q 49 -29 64 -5 Q 69 2 61 10 Q 43 31 10 31 Q -20 33 -42 6 Z',body,p[2],1.8);
      c.shadowColor='transparent';
      // Iridescent, individually curved scales survive small sprite sizes.
      for(let row=-2;row<=2;row++) for(let col=0;col<4;col++) {
        const sx=-22+col*11+(row%2)*5,sy=row*9;
        if (sx < 3) path(c,`M ${sx-3} ${sy-4} Q ${sx+4} ${sy} ${sx-3} ${sy+4}`,null,p[0]+'42',1);
      }
      path(c,'M -8 5 Q -2 17 -19 28 Q -31 11 -8 5 Z',fin,p[0]+'77',1);
      path(c,'M -28 -12 Q -3 -30 29 -19',null,p[0]+'99',2.5);
      if(type==='coin') {
        ellipse(c,8,0,17,20,'#bd7b2c','#ffef9e',2);
        ellipse(c,8,0,12.5,16,'#eeb344','#fff1a855',1);
        c.font='bold 25px Georgia'; c.textAlign='center';c.textBaseline='middle';c.fillStyle='#fff1b4';c.fillText('$',8,1);
      } else if(type==='save') {
        path(c,'M -5 -10 L 10 -19 L 27 -10 Z','#fff0b3','#e4ffdf',1);
        for(let i=0;i<3;i++)path(c,`M ${i*10-1} -7 L ${i*10-1} 10`,null,'#fff1b9',3);
        path(c,'M -6 13 L 28 13',null,'#fff1b9',3);
      } else {
        for(const [x,top,bottom,col] of [[-5,-10,12,'#defac2'],[6,-4,16,'#7e2e4e'],[17,-16,6,'#defac2'],[28,-20,0,'#defac2']]) {
          path(c,`M ${x} ${top-4} L ${x} ${bottom+4}`,null,col,1.2);
          c.fillStyle=col;c.fillRect(x-3,top,6,bottom-top);
        }
      }
      path(c,'M 50 14 Q 56 17 60 10',null,p[2],1.5);
    }
    const ex=({fund:35,whale:53,midas:53,shark:46,ray:40,bond:53,crypto:43,gold:30,lantern:30,puffer:26})[type]??45;
    const ey=({fund:-8,whale:-1,midas:-1,shark:-4,ray:-9,bond:-5,crypto:-10,gold:-38,lantern:-10,puffer:-7})[type]??-6;

  function drawFish(c,f,time) {
    const type=palettes[f.type]?f.type:'coin', s=(f.size||25)/54;
    const wave=Math.sin(time*(type==='shark'?10:type==='ray'?3:type==='midas'?4:6)+(f.phase||0));
    if(f.tide?.phase==='charge'){
      const remaining=Math.max(0,f.tide.left/f.tide.duration);
      const broken=Math.min(1,f.tide.damage/f.tide.target);
      c.save();c.translate(f.x,f.y);
      // Gold brackets contract towards the whale. The mint arc fills with player hits.
      c.lineCap='round';c.lineWidth=3;
      const rx=f.size*(1.12+.3*remaining),ry=f.size*(.7+.2*remaining);
      for(const start of [-.65,Math.PI-.65]){
        c.beginPath();c.ellipse(0,0,rx,ry,0,start,start+1.3);c.strokeStyle='#241e28';c.lineWidth=7;c.stroke();
        c.strokeStyle='#ffae70';c.lineWidth=3;c.stroke();
      }
      c.beginPath();c.ellipse(0,0,rx*.95,ry*.94,0,.55,Math.PI-.55);c.strokeStyle='#18433c';c.lineWidth=5;c.stroke();
      if(broken){c.beginPath();c.ellipse(0,0,rx*.95,ry*.94,0,.55,.55+(Math.PI-1.1)*broken);c.strokeStyle='#94ffda';c.lineWidth=4;c.stroke();}
      c.restore();
    }
    c.save();c.translate(f.x,f.y);c.rotate(f.angle||0);
    // Flip the image vertically for leftward swimmers so their fins stay upright.
    const a=((f.angle||0)%TAU+TAU)%TAU;
    if(a>Math.PI/2&&a<Math.PI*1.5)c.scale(1,-1);
    c.scale(s,s);
    if(type==='ray')c.scale(1,1+wave*.055);
    if(type==='crypto')c.scale(1+wave*.045,1-wave*.035);
    if(type==='puffer')c.scale(1+(f.puff||0)*.13,1+(f.puff||0)*.3);
    if(f.tide?.phase==='surge'){
      c.lineCap='round';
      for(const yy of [-14,0,14]){
        c.beginPath();c.moveTo(-48,yy);c.quadraticCurveTo(-85,yy*1.5,-112,yy*1.2);
        c.strokeStyle='#ffdc91aa';c.lineWidth=2.5;c.stroke();
      }
    }
    if(type==='shark'){
      c.save();c.globalAlpha=.18;c.strokeStyle='#b6edff';c.lineWidth=1.4;
      for(let i=0;i<3;i++){c.beginPath();c.moveTo(-65,-16+i*16);c.lineTo(-88-(i%2)*5,-16+i*16);c.stroke();}c.restore();
    }
    if(f.hit>0){c.shadowColor='#fff8c8';c.shadowBlur=18;}
    const tailLift=f.tide?.phase==='charge'?(1-f.tide.left/f.tide.duration)*.75:f.tide?.phase==='surge'?-.4:0;
    c.save();c.translate(-36,0);c.rotate(wave*(type==='whale'?.09:.15)+tailLift);c.translate(36,0);
    c.drawImage(makeSprite(type,true),-96,-72,192,144);c.restore();
    c.drawImage(makeSprite(type,false),-96,-72,192,144);
    if(type==='lantern'){
      const charge=f.beacon||0;
      ellipse(c,61,-36,14+charge*10,14+charge*10,'#72ffc821');
      ellipse(c,61,-36,7+charge*2,7+charge*2,'#76ffd7cc');
      ellipse(c,61,-36,3+charge*2,3+charge*2,'#f3fff0');
      if(f.luring)ellipse(c,61,-36,19+charge*9,19+charge*9,null,'#a4ffccaa',1.7);
    }
    if(f.tide?.phase==='charge'){
      ellipse(c,0,0,18,18,'#6a402bcc','#ffd197',2.2);
      path(c,'M 0 -14 L 3 -4 L 12 0 L 3 4 L 0 14 L -3 4 L -12 0 L -3 -4 Z','#fff3b7');
    }
    if(f.hit>0){c.globalAlpha=Math.min(.35,f.hit*3);ellipse(c,0,0,46,27,'#fff8d6');}
    c.restore();
  }

  function buildBackground(w,h) {
    const canvas=document.createElement('canvas');canvas.width=w;canvas.height=h;
    const c=canvas.getContext('2d');
    // Christmas harbour depths: winter teal water, warm gold glow, festive seabed.
    c.fillStyle=gradient(c,0,0,0,h,[[0,'#163a55'],[.28,'#0b2a3a'],[.7,'#082430'],[1,'#061820']]);c.fillRect(0,0,w,h);
    const glow=c.createRadialGradient(w*.55,-h*.06,0,w*.55,h*.12,w*.7);glow.addColorStop(0,'#edb57933');glow.addColorStop(.45,'#2f8f5b18');glow.addColorStop(1,'#05263300');c.fillStyle=glow;c.fillRect(0,0,w,h);
    c.fillStyle='#0a3340';
    for(let i=0;i<19;i++){
      const x=i*w/18,hh=(.05+((i*17)%9)/70)*h,bw=w/23;
      c.beginPath();c.roundRect(x-bw/2,h-hh,bw,hh+10,[7,7,0,0]);c.fill();
      if(i%3===0){c.fillStyle='#155354';c.fillRect(x-bw*.18,h-hh+12,3,hh*.5);c.fillStyle='#0a3340';}
    }
    path(c,`M 0 ${h*.88} Q ${w*.19} ${h*.83} ${w*.34} ${h*.94} Q ${w*.65} ${h*.86} ${w} ${h*.9} L ${w} ${h} L 0 ${h} Z`,'#0a343a');
    path(c,`M 0 ${h*.96} Q ${w*.28} ${h*.86} ${w*.49} ${h*.99} Q ${w*.79} ${h*.9} ${w} ${h*.98} L ${w} ${h} L 0 ${h} Z`,'#12484f');
    const plant=(x,y,height,col,seed)=>{
      c.save();c.translate(x,y);c.strokeStyle=col;c.lineCap='round';
      for(let j=-2;j<=2;j++){
        const xx=j*height*.19,top=-height*(.55+(j+seed+5)%3*.2);
        c.lineWidth=height*.055;
        c.beginPath();c.moveTo(0,5);c.bezierCurveTo(xx*.4,-height*.3,xx*1.3,top*.7,xx,top);c.stroke();
        for(let k=1;k<4;k++){const yy=top*k/4;c.lineWidth=height*.025;c.beginPath();c.moveTo(xx*k/4,yy);c.quadraticCurveTo(xx*k/4+(j>0?9:-9),yy-6,xx*k/4+(j>0?13:-13),yy-15);c.stroke();}
      } c.restore();
    };
    plant(w*.04,h*.99,h*.16,'#2f8f5b',1);plant(w*.94,h*.99,h*.2,'#1f5a3f',2);plant(w*.13,h*1.04,h*.12,'#34825a',3);plant(w*.83,h*1.05,h*.11,'#2a6f4d',1);
    // Festive seabed props: gifts + Christmas trees.
    for(let i=0;i<5;i++){
      const x=w*(.12+i*.18),y=h*.93,bw=22+(i%2)*5,bh=16+(i%3)*3,fill=['#c23b3b','#2f8f5b','#edb579'][i%3];
      c.fillStyle=fill;c.beginPath();c.roundRect(x-bw/2,y-bh,bw,bh,3);c.fill();
      c.fillStyle='#fff2c8cc';c.fillRect(x-bw/2,y-bh/2-2,bw,5);c.fillRect(x-2.5,y-bh,5,bh);
    }
    const xmasTree=(tx,ty,sc)=>{
      c.fillStyle='#1f5a3f';c.beginPath();c.moveTo(tx,ty-72*sc);c.lineTo(tx+34*sc,ty);c.lineTo(tx-34*sc,ty);c.closePath();c.fill();
      c.fillStyle='#2a6f4d';c.beginPath();c.moveTo(tx,ty-56*sc);c.lineTo(tx+26*sc,ty-10*sc);c.lineTo(tx-26*sc,ty-10*sc);c.closePath();c.fill();
      c.fillStyle='#6b4423';c.fillRect(tx-5*sc,ty,10*sc,14*sc);
      for(const [ox,oy,col] of [[-12,-28,'#c23b3b'],[10,-36,'#edb579'],[0,-48,'#fff2c8'],[-8,-16,'#edb579'],[12,-20,'#c23b3b']]){
        c.fillStyle=col;c.beginPath();c.arc(tx+ox*sc,ty+oy*sc,3.5*sc,0,TAU);c.fill();
      }
    };
    xmasTree(w*.08,h*.9,1.1);xmasTree(w*.92,h*.88,1.25);xmasTree(w*.5,h*.95,.7);
    for(const [cx,cy,sc,tilt] of [[w*.22,h*.9,.9,.15],[w*.38,h*.92,.7,-.2],[w*.62,h*.91,.85,.25],[w*.78,h*.89,.75,-.1]]){
      candyCane(c,cx,cy,sc,tilt);
    }
    c.save();c.globalAlpha=.42;c.translate(w*.06,h*.87);c.rotate(-.22);
    ellipse(c,0,0,25,19,'#756044','#edb579',3);ellipse(c,0,0,17,12,'#143e43','#fff2c8',2);c.restore();
    for(let i=0;i<34;i++){
      const x=((i*137.17)%997)/997*w,y=h*.94+((i*47)%83)/83*h*.06;

  }

  function drawBackground(c,w,h,time,quality=1){
    const key=w+'x'+h;
    if(!backgrounds.has(key)){backgrounds.clear();backgrounds.set(key,buildBackground(w,h));}
    c.drawImage(backgrounds.get(key),0,0,w,h);
    c.save();
    for(let i=0;i<4;i++){
      const x=w*(.13+i*.22)+Math.sin(time*.15+i)*w*.025;
      const g=gradient(c,x,0,x,h*.82,[[0,'#b0ffe014'],[1,'#83f8d000']]);
      path(c,`M ${x} 0 L ${x+w*.035} 0 L ${x+w*.25} ${h} L ${x-w*.12} ${h} Z`,g);
    }
    const count=quality<.7?14:28;
    for(let i=0;i<count;i++){
      const speed=10+(i*13%17),x=((i*151.7)%991)/991*w+Math.sin(time*.34+i*2.7)*7;
      const y=h-((time*speed+i*71.1)%(h+25)),r=1.2+(i%4)*.7;

      if(i%3===0)ellipse(c,x-r*.2,y-r*.25,r*.28,r*.28,'#fff4d255');
    }
    c.restore();
  }

  // Cache the enamel, metal and engraved detail at double resolution. Only the
  // barrel rotation, recoil, lamps and water flash change from frame to frame.
  function cannonSprite(key, paint) {
    if (!sprites.has(key)) {
      const icon = document.createElement('canvas');
      icon.width = icon.height = 352;
      const c = icon.getContext('2d');
      c.scale(2, 2);
      c.translate(88, 88);
      c.lineJoin = 'round';
      c.lineCap = 'round';
      paint(c);
      sprites.set(key, icon);
    }
    return sprites.get(key);
  }

  function paintCompass(c) {
    ellipse(c,0,0,21,21,'#314c4c','#edce88',2.6);

  const defaultCannonForms = ['single','single','double','spread','orb','beam','spread','orb','beam','spread','orb','hybrid'];
  function drawDischarge(c, form, kick) {
    const accent = cannonLight[form];
    c.save();
    c.translate(74,0);
    c.globalAlpha=kick*.85;
    if (form === 'frost') {
      for (const side of [-1,1]) {

        path(c,'M -1 0 L 6 -2 L 11 -1 L 18 0 L 8 2 Z','#d5fbff');
        path(c,'M 8 -1 L 12 -5 M 8 1 L 12 5',null,'#86e8ff',1.3);

    for (let i=0;i<4;i++) {

  function drawCoin(c,x,y,r,spin=0){
    c.save();c.translate(x,y);c.scale(Math.max(.18,Math.abs(Math.cos(spin))),1);
    c.fillStyle=gradient(c,0,-r,0,r,[[0,'#fff6bd'],[.25,'#ffdc69'],[.65,'#d79330'],[1,'#ffca59']]);

    c.fillStyle='#8e5a23';c.font=`bold ${r*1.4}px Georgia`;c.textAlign='center';c.textBaseline='middle';c.fillText('$',0,r*.08);
    c.restore();

  const supplyColors = {freeze:'#b7f5ff', rapid:'#ffe38a', bomb:'#d9c9ff', lure:'#a5f5d5'};
  function drawSupply(c,x,y,kind) {

      } else {
        path(b,'M 0 -14 L 8 -10 L 12 -3 L 11 5 L 5 12 L -5 12 L -11 5 L -12 -3 L -8 -10 Z','#5a462d',edge,1.8);
        path(b,'M 9 -1 C 8 -9 -7 -10 -8 -1 C -9 7 3 10 5 3 C 7 -3 -1 -5 -3 -1 Q -4 3 0 2',null,'#fff0c6',1.75);
      }
      sprites.set(key,icon);
    }
    c.drawImage(sprites.get(key),x-18,y-18,36,36);
  }
  return { drawFish, drawBackground, drawCannon, drawCoin, drawSupply };

function gridMembers(config, width, height) {
    const grid = Array.isArray(config.grid) ? config.grid : [];
    if (!grid.length) return [];
    const rowCount = grid.length;
    const colCount = Math.max(...grid.map(row => Array.isArray(row) ? row.length : 0), 0);
    const centerRow = Math.floor(rowCount / 2);
    const maxColIndex = Math.max(0, colCount - 1);
    const cells = [];

        const row = Array.isArray(grid[rowIndex]) ? grid[rowIndex] : [];

            const typeIndex = Number(row[colIndex] || 0);

    const spacingY = Math.min(Math.max(26, maxFishSize * verticalSpacingScale), Math.max(18, (height - 170) / Math.max(1, rowCount)));
    cells.sort((leftCell, rightCell) => {
        if (leftCell.colIndex !== rightCell.colIndex) return rightCell.colIndex - leftCell.colIndex;

    return cells.map(cell => ({
        offsetX: (maxColIndex - cell.colIndex) * spacingX,
        offsetY: (cell.rowIndex - centerRow) * spacingY,
        sourceType: cell.typeIndex,
        speedMultiplier: config.speedMultiplier || 1
    }));

    direction = direction < 0 ? -1 : 1;
    const formations = FishFormation.SCHOOL_FORMATIONS;

            const a = index / count * Math.PI * 2;

    const sharedPhase = random() * Math.PI * 2;
    return members.map((entry, index) => {
        const spawnOffset = 70 + Math.abs(entry.offsetX);
        return {
            x: direction > 0 ? -spawnOffset : width + spawnOffset,
            y: clampedBaseY + entry.offsetY,

            phase: sharedPhase + (kind === 'wave' ? index * 0.26 : 0),

<script>/* Shared by the booth desk and the three games. All storage is on this browser. */
(function (root) {
  'use strict';
  const prefix = 'fulam.booth.mark.v1.';
  const ticketKey = 'fulam.booth.ticket.v1';
  const pinKey = 'fulam.booth.staff.v1';
  const games = {knife: 'game', fishing: 'fishing', fleet: 'fleet'};
  const titles = {knife: 'One Slice', fishing: 'FuLam Catch', fleet: 'Wealth Wings'};
  const csvFields = ['UID', 'Game', 'Score', 'Finished (UTC)', 'Status', 'Attempt ID'];
  const legacyHeader = '"UID","Game","Score","Finished (UTC)","Status","Forms response ID","Attempt ID"';
  const uidPattern = '303[0-9]{7}';
  const uidRegex = new RegExp('^' + uidPattern + '$');
  const validUID = uid => typeof uid === 'string' && uid.length === 10 && uidRegex.test(uid);
  const previousUID = uid => typeof uid === 'string' && /^[A-Za-z0-9][A-Za-z0-9._-]{0,63}$/.test(uid);
  const validID = id => typeof id === 'string' && /^[a-f0-9]{8}(?:-[a-f0-9]{4}){3}-[a-f0-9]{12}$/.test(id);

  function records(storage) {
    const rows = [];
    for (let i = 0; i < storage.length; i++) {
      const key = storage.key(i);
      if (!key?.startsWith(prefix)) continue;
      const row = JSON.parse(storage.getItem(key));
      if (row && key === prefix + row.id && previousUID(row.uid) && Object.hasOwn(games, row.game) && Number.isSafeInteger(row.score)) {
        // Earlier previews used the Forms response number as the confirmation flag.
        const {responseId, ...mark} = row;
        rows.push({...mark, confirmed: mark.confirmed === true || Boolean(responseId)});
      }
    }
    return rows.sort((a, b) => b.finished.localeCompare(a.finished) || a.id.localeCompare(b.id));
  }

  function leaderboard(rows, game) {
    const best = new Map();
    for (const row of rows) {
      if (row.game !== game || !row.confirmed || !validUID(row.uid)) continue;
      if (!best.has(row.uid) || row.score > best.get(row.uid).score) best.set(row.uid, row);
    }
    let rank = 0, last;
    return [...best.values()].sort((a, b) => b.score - a.score || a.finished.localeCompare(b.finished) || a.id.localeCompare(b.id)).map((row, i) => {
      if (row.score !== last) rank = i + 1;
      last = row.score;
      return {rank, player: '•••• ' + row.uid.slice(-4), score: row.score};
    });
  }

  function launch(game, uid, id) {
    if (!validID(id) || !validUID(uid) || !Object.hasOwn(games, game)) throw new Error('Invalid booth entry');
    const probe = prefix + 'probe.' + id;
    root.localStorage.setItem(probe, 'null');
    root.localStorage.removeItem(probe);
    root.sessionStorage.setItem(ticketKey, JSON.stringify({id, uid, game}));
    return '../' + games[game] + '/?station=' + id;
  }

  function gameAttempt(game) {
    const id = new URLSearchParams(root.location.search).get('station');
    if (id === null) return null;
    const desk = '../booth/station.html';
    const review = desk + '?review=' + encodeURIComponent(id);
    let player, mark;
    function begin() {
      try {
        if (validID(id) && root.localStorage.getItem(prefix + id)) {
          root.location.replace(review);
          return false;
        }
        const ticket = JSON.parse(root.sessionStorage.getItem(ticketKey));
        if (validID(id) && ticket?.id === id && ticket.game === game && validUID(ticket.uid)) {
          root.sessionStorage.removeItem(ticketKey);
          player = ticket.uid;
          return true;
        }
      } catch { /* Return to the desk so staff can recover. */ }
      root.location.replace(desk);
      return false;
    }
    function finish(score) {
      if (!player) return false;
      mark ??= {id, game, uid: player, score, finished: new Date().toISOString(), confirmed: false};
      try {
        if (!root.localStorage.getItem(prefix + id)) root.localStorage.setItem(prefix + id, JSON.stringify(mark));
      } catch { return false; }
      root.location.replace(review);
      return true;
    }
    root.document.addEventListener('click', event => {
      if (mark && event.target.closest('[data-retry-booth-save]')) finish(mark.score);
    });
    return {begin, finish, get uid() { return player; }};
  }

  function confirm(storage, id) {
    if (!validID(id)) throw new Error('Invalid attempt');
    const row = JSON.parse(storage.getItem(prefix + id));
    if (!row || !validUID(row.uid)) throw new Error('Missing score or invalid UID');
    if (row.confirmed !== true) {
      const {id, uid, game, score, finished} = row;
      storage.setItem(prefix + id, JSON.stringify({id, uid, game, score, finished, confirmed: true}));
    }
  }

  function toCSV(rows) {
    const fields = [csvFields, ...rows.map(r => {
      const status = (validUID(r.uid) ? '' : 'Archived: ') + (r.confirmed ? 'Confirmed' : 'Pending');
      return [r.uid, titles[r.game], r.score, r.finished, status, r.id];
    })];
    return fields.map(row => row.map(value => '"' + String(value).replaceAll('"','""') + '"').join(',')).join('\r\n');
  }

  function importExports(storage, files) {
    const existing = records(storage);
    const byId = new Map(existing.map(row => [row.id, row]));
    const changes = new Map();
    for (const file of files) {
      const [header, ...lines] = file.replace(/^\uFEFF/, '').trimEnd().split(/\r?\n/);
      const legacy = header === legacyHeader;
      if (!legacy && header !== toCSV([])) throw new Error('Invalid export');
      for (const line of lines) {
        if (!/^"[^"]*"(?:,"[^"]*")+$/.test(line)) throw new Error('Invalid export');
        const columns = line.slice(1,-1).split('","');
        if (columns.length !== (legacy ? 7 : 6)) throw new Error('Invalid export');
        const [uid, title, points, finished, status] = columns;
        const id = columns.at(-1);
        const archived = !validUID(uid);
        const statusPrefix = !legacy && archived ? 'Archived: ' : '';
        const confirmed = status === statusPrefix + 'Confirmed';
        const game = Object.keys(titles).find(key => titles[key] === title);
        const score = Number(points);
        if (!previousUID(uid) || !validID(id) || !game || !/^\d+$/.test(points) || !Number.isSafeInteger(score) ||
            !Number.isFinite(Date.parse(finished)) || new Date(finished).toISOString() !== finished ||
            (!confirmed && status !== statusPrefix + 'Pending')) throw new Error('Invalid export');
        if (legacy && (confirmed ? !/^[1-9]\d{0,14}$/.test(columns[5]) : columns[5] !== '')) throw new Error('Invalid export');
        const old = byId.get(id);
        if (old && (old.uid !== uid || old.game !== game || old.score !== score || old.finished !== finished)) throw new Error('Conflicting attempt');
        if (!old || (!old.confirmed && confirmed)) {
          const row = {id, uid, game, score, finished, confirmed};
          byId.set(id, row);
          changes.set(id, row);
        }
      }
    }
    for (const [id, row] of changes) storage.setItem(prefix + id, JSON.stringify(row));
    return changes.size;
  }

  async function pinHash(pin, salt) {
    const bytes = new TextEncoder().encode(pin);
    const key = await root.crypto.subtle.importKey('raw', bytes, 'PBKDF2', false, ['deriveBits']);
    const digest = await root.crypto.subtle.deriveBits({name: 'PBKDF2', salt: new TextEncoder().encode(salt), iterations: 100000, hash: 'SHA-256'}, key, 256);
    return Array.from(new Uint8Array(digest), byte => byte.toString(16).padStart(2, '0')).join('');
  }
  async function setupPin(pin) {
    if (!/^\d{4,8}$/.test(pin)) throw new Error('Invalid PIN');
    const salt = root.crypto.randomUUID();
    const hash = await pinHash(pin, salt);
    if (hasPin()) return false;
    root.localStorage.setItem(pinKey, JSON.stringify({salt, hash}));
    return true;
  }
  function hasPin() { return !!root.localStorage.getItem(pinKey); }
  async function checkPin(pin) {
    const saved = JSON.parse(root.localStorage.getItem(pinKey));
    return !!saved && saved.hash === await pinHash(pin, saved.salt);
  }
  root.FuLamStation = {prefix, uidPattern, validUID, records, leaderboard, launch, gameAttempt, confirm, setupPin, hasPin, checkPin, toCSV, importExports};
})(typeof window === 'undefined' ? globalThis : window);

function damage(f,amount,impact='direct',shotAim=angle){

   score+=60;

}

 const ax=((x1-f.x)*cs+(y1-f.y)*sn)/rx,ay=(-(x1-f.x)*sn+(y1-f.y)*cs)/ry;

}

function targetableFish(f){return !f.dead&&f.x>=0&&f.x<=w&&f.y>=0&&f.y<=h;}
function schoolCentre(field,id){
 const candidates=fish.filter(f=>targetableFish(f)&&(id!=='lure'||!defs[f.type].boss));
 let centre=null,best=-Infinity;
 for(const f of candidates){
  let weight=0;
  for(const other of candidates)if(Math.hypot(f.x-other.x,f.y-other.y)<field.radius*.9)weight++;
  // Favour the densest school, then the one nearest the catch.
  weight-=Math.hypot(f.x-field.x,f.y-field.y)/Math.hypot(w,h);
  if(weight>best){best=weight;centre=f;}
 }

}

  f.scanned=true;f.tagged=sonarTime;sonarSlots--;

  score+=bonus;scanPoints+=bonus;

 }
 ctx.stroke();
 const front=reduced?r.end:r.end*(1-Math.pow(1-Math.min(1,progress/.68),2));
 ctx.beginPath();ctx.arc(0,0,front,0,TAU);
 ctx.fillStyle=r.color;ctx.globalAlpha=fade*.045;ctx.fill();

  // Short mint crests trail the outer pressure wave.
  const wake=front*.82;
  ctx.globalAlpha=fade*.52;ctx.strokeStyle='#9de7d6';ctx.lineWidth=1.5;ctx.beginPath();
  for(let i=0;i<3;i++){
   const a=i*TAU/3+.14;
   ctx.moveTo(Math.cos(a)*wake,Math.sin(a)*wake);ctx.arc(0,0,wake,a,a+.63);
  }
  ctx.stroke();
 }
 if(r.showShards)drawSugarShards(r,progress);
 const core=reduced?8:Math.min(18,r.end*.19)*Math.max(0,1-progress/.48);

  ctx.quadraticCurveTo(2,1,0,core*.8);ctx.quadraticCurveTo(-1,2,-core*.88,0);
  ctx.quadraticCurveTo(-2,-1,0,-core);ctx.fill();

}

function loop(now){
